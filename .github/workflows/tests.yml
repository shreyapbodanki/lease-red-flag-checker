name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # unit tests need no api key
      - run: pytest -q
      # check the eval pipeline end to end with a fake model
      - run: python eval/run_eval.py --dry-run --mode both
